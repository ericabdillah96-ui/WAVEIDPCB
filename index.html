<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir PO PCB</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #2c3e50, #3498db); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 480px; padding: 30px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #34495e; font-weight: 500; }
        input, textarea { width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; }
        input:focus, textarea:focus { outline: none; border-color: #3498db; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #27ae60, #2ecc71); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        .alert { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; }
        .sukses { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
        .no-po { font-weight: bold; font-size: 16px; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h2>📋 Formulir PO PCB</h2>
    <form id="formPO">
        <div class="form-group">
            <label>Nama Pemesan</label>
            <input type="text" name="nama" required placeholder="Masukkan nama lengkap...">
        </div>
        <div class="form-group">
            <label>Nomor HP</label>
            <input type="tel" name="hp" required placeholder="Contoh: 081234567890">
        </div>
        <div class="form-group">
            <label>Alamat Lengkap</label>
            <textarea name="alamat" rows="3" required placeholder="Masukkan alamat pengiriman..."></textarea>
        </div>
        <div class="form-group">
            <label>Jumlah PCB</label>
            <input type="number" name="jumlah" min="1" required placeholder="Contoh: 50">
        </div>
        <button type="submit" id="btnKirim">✅ Kirim Pesanan</button>
    </form>
    <div id="pesan" class="alert"></div>
</div>

<script>
// ✅ URL SUDAH DIISI OTOMATIS
const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbxpioUOarNseVKGqW_-baj0W4rji0M0VtNDYDHU0rhJ83us2fvQmrQwN8kq_xKtqQE/exec";

const form = document.getElementById("formPO");
const btnKirim = document.getElementById("btnKirim");
const pesan = document.getElementById("pesan");

form.addEventListener("submit", async function(e) {
    e.preventDefault();
    btnKirim.disabled = true;
    btnKirim.textContent = "⏳ Mengirim...";
    pesan.className = "alert";

    try {
        const formData = new FormData(form);
        const res = await fetch(URL_WEB_APP, { method: "POST", body: formData });
        const hasil = await res.json();

        if (hasil.status === "BERHASIL") {
            pesan.className = "alert sukses";
            pesan.innerHTML = "✅ Pesanan Tersimpan!<div class='no-po'>Nomor PO: " + hasil.no_po + "</div>";
            form.reset();
        } else {
            pesan.className = "alert error";
            pesan.textContent = "❌ Gagal dikirim!";
        }
    } catch (err) {
        pesan.className = "alert error";
        pesan.textContent = "❌ Error: " + err.message;
    }

    btnKirim.disabled = false;
    btnKirim.textContent = "✅ Kirim Pesanan";
});
</script>
</body>
</html>
